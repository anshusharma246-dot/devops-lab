name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check files
        run: |
          pwd
          ls -la
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.sha }}

      - name: Deploy application
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.sha }}
          docker run -d -p 8080:5000 --name web ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080
